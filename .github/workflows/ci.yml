name: Build and tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: delta-xaml-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: DeltaXAML
      - name: Checkout DeltaDiagnostics sibling
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaDiagnostics
          path: DeltaDiagnostics
      - name: Checkout DeltaText sibling
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaText
          path: DeltaText
      - name: Checkout DeltaMaths sibling
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaMaths
          path: DeltaMaths
      - name: Checkout DeltaRender sibling
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaRender
          path: DeltaRender
      - name: Checkout DeltaShader sibling
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaShader
          path: DeltaShader
      - name: Install .NET 8 and 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Configure GitHub Packages
        env:
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet nuget add source \
            https://nuget.pkg.github.com/Artromskiy/index.json \
            --name github \
            --username "${{ github.repository_owner }}" \
            --password "$NUGET_AUTH_TOKEN" \
            --store-password-in-clear-text
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: delta-xaml-nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: delta-xaml-nuget-${{ runner.os }}-
      - name: Restore and build
        working-directory: DeltaXAML
        run: |
          dotnet restore DeltaXAML.slnx
          dotnet build DeltaXAML.slnx -c Release --no-restore
      - name: Run tests
        working-directory: DeltaXAML
        run: dotnet run --project tests/DeltaXAML.Tests/DeltaXAML.Tests.csproj -c Release --no-build --no-restore
