name: Build and tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: delta-xaml-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
  SIXLABORS_FONTS_COMMIT: c68b27d683c701ca254d5cfc6487c699954f19ff
  SIXLABORS_FONTS_PACKAGE_VERSION: 3.1.0-source.c68b27d

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          path: DeltaXAML
      - name: Checkout DeltaDiagnostics sibling
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaDiagnostics
          path: DeltaDiagnostics
      - name: Checkout DeltaText sibling
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaText
          path: DeltaText
      - name: Checkout DeltaMaths sibling
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaMaths
          path: DeltaMaths
      - name: Checkout DeltaRender sibling
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaRender
          path: DeltaRender
      - name: Checkout DeltaShader sibling
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/DeltaShader
          path: DeltaShader
      - name: Install .NET 8 and 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Configure GitHub Packages
        working-directory: DeltaXAML
        run: |
          dotnet nuget add source \
            https://nuget.pkg.github.com/Artromskiy/index.json \
            --name github-artromskiy \
            --username "${{ github.repository_owner }}" \
            --password "${{ github.token }}" \
            --store-password-in-clear-text
      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Materialize Six Labors license
        env:
          SIXLABORS_LICENSE: ${{ secrets.SIXLABORS_LICENSE }}
        run: |
          if [ -z "$SIXLABORS_LICENSE" ]; then
            echo "::error::Repository secret SIXLABORS_LICENSE is required for the build-time SixLabors.Fonts package."
            exit 1
          fi
          printf '%s\n' "$SIXLABORS_LICENSE" > "$RUNNER_TEMP/sixlabors.lic"
          echo "SixLaborsLicenseFile=$RUNNER_TEMP/sixlabors.lic" >> "$GITHUB_ENV"
      - name: Checkout pinned SixLabors Fonts fork
        uses: actions/checkout@v7
        with:
          repository: Artromskiy/Fonts
          ref: ${{ env.SIXLABORS_FONTS_COMMIT }}
          path: third_party/SixLabors.Fonts
      - name: Restore SixLabors build infrastructure
        run: git -C third_party/SixLabors.Fonts submodule update --init --recursive shared-infrastructure
      - name: Pack pinned SixLabors Fonts fork
        run: |
          dotnet pack third_party/SixLabors.Fonts/src/SixLabors.Fonts/SixLabors.Fonts.csproj \
            -c Release \
            --output "$RUNNER_TEMP/sixlabors-feed" \
            -p:PackageId=SixLabors.Fonts.Delta \
            -p:PackageVersion="$SIXLABORS_FONTS_PACKAGE_VERSION" \
            -p:MinVerVersionOverride="$SIXLABORS_FONTS_PACKAGE_VERSION" \
            -p:RepositoryUrl=https://github.com/Artromskiy/Fonts \
            --disable-build-servers -m:1 /p:UseSharedCompilation=false
      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: delta-xaml-nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: delta-xaml-nuget-${{ runner.os }}-
      - name: Prepare current workspace packages
        working-directory: DeltaXAML
        env:
          NUGET_GITHUB_SOURCE: https://nuget.pkg.github.com/Artromskiy/index.json
          SIXLABORS_FONTS_SOURCE: ${{ runner.temp }}/sixlabors-feed
        run: ../DeltaRender/eng/prepare-ci-packages.sh "$RUNNER_TEMP/delta-xaml-packages"
      - name: Restore and build
        working-directory: DeltaXAML
        run: |
          ./eng/check-deltamaths-usage.sh
          dotnet restore DeltaXAML.slnx \
            --source "$RUNNER_TEMP/delta-xaml-packages" \
            --source https://api.nuget.org/v3/index.json \
            --source https://nuget.pkg.github.com/Artromskiy/index.json \
            --ignore-failed-sources
          dotnet build DeltaXAML.slnx -c Release --no-restore
      - name: Run tests
        working-directory: DeltaXAML
        run: dotnet run --project tests/DeltaXAML.Tests/DeltaXAML.Tests.csproj -c Release --no-build --no-restore
